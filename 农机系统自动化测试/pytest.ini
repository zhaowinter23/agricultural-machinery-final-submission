[pytest]
# 用测试专用 settings（继承主系统，仅覆盖数据库位置）
DJANGO_SETTINGS_MODULE = test_settings

# 关键：在 pytest-django 极早期扫描 settings 之前，把路径加进 sys.path。
# ../agricultural-machinery-system 是同级的主系统目录（注意：pytest 的
# pythonpath 按空白拆分，路径里不能有空格，故主系统目录名为无空格形式）；
# . 让本测试目录可被 import（找 test_settings）。
# 注意：主系统目录需与本测试目录保持同级、目录名不变。
pythonpath =
    ../agricultural-machinery-system
    .

# 测试用例分布在这三个目录
testpaths = unit integration e2e
python_files = test_*.py

# --strict-markers: 打错 marker 名直接报错，避免用例被静默跳过
# --tb=short: 失败时精简堆栈
addopts = --strict-markers --tb=short

markers =
    e2e: 端到端测试（需浏览器，慢；单独跑: pytest -m e2e；跳过: pytest -m "not e2e"）
