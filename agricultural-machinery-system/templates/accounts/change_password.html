{% extends 'base.html' %}

{% block title %}修改密码 - 农机作业数据分析系统{% endblock %}

{% block extra_css %}
<style>
body {
    background: linear-gradient(135deg, #0d1b0e 0%, #1a472a 40%, #2d6a4f 70%, #1b4332 100%);
    min-height: 100vh;
}
.navbar { background: rgba(13,27,14,0.8) !important; backdrop-filter: blur(12px); }

.pwd-page {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
.pwd-page::before {
    content: '';
    position: absolute;
    width: 350px; height: 350px;
    background: #40916c;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.2;
    top: -80px; right: -80px;
}
.pwd-box {
    position: relative;
    z-index: 2;
    width: 420px;
    max-width: 92vw;
}
.brand-area {
    text-align: center;
    margin-bottom: 28px;
}
.brand-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
}
.brand-icon i { font-size: 26px; color: #52b788; }
.brand-area h2 { color: white; font-size: 22px; font-weight: 700; }
.form-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.input-group-custom {
    position: relative;
    margin-bottom: 18px;
}
.input-group-custom i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 15px;
    z-index: 1;
}
.input-group-custom input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
}
.input-group-custom input::placeholder { color: rgba(255,255,255,0.25); }
.input-group-custom input:focus {
    border-color: #52b788;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
}
.pwd-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #40916c, #52b788);
    color: white;
    box-shadow: 0 4px 20px rgba(64,145,108,0.35);
    margin-top: 6px;
}
.pwd-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(64,145,108,0.45); }
.text-danger.small { color: #ff8a80 !important; font-size: 12px; margin-top: 4px; }
</style>
{% endblock %}

{% block content %}
<div class="pwd-page">
    <div class="pwd-box">
        <div class="brand-area">
            <div class="brand-icon"><i class="bi bi-key-fill"></i></div>
            <h2>修改密码</h2>
        </div>
        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="input-group-custom">
                    <input type="password" name="{{ field.html_name }}" placeholder="{{ field.label }}" id="{{ field.id_for_label }}" required>
                    <i class="bi bi-lock"></i>
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="pwd-btn">确认修改</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
